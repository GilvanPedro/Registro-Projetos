# ===== Servidor =====
server.port=8080

# ===== SQLite =====
# O arquivo portfolio.db vai ser criado na raiz do backend-api na primeira execucao
spring.datasource.url=jdbc:sqlite:portfolio.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Dialeto community, necessario porque o Hibernate nao suporta SQLite nativamente
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== CORS (o Next.js roda em outra porta) =====
app.cors.allowed-origin=http://localhost:3000
